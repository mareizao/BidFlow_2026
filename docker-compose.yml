version: '3.8'

services:
  auth-svc:
    build: ./services/auth
    container_name: bidflow-auth
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL}
      AUTH_SCHEMA: auth
      JWT_SECRET: ${JWT_SECRET}
    restart: unless-stopped

  bid-svc:
    build: ./services/bid
    container_name: bidflow-bid
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      DATABASE_URL: ${DATABASE_URL}
      BID_SCHEMA: bid
      AUTH_SVC_URL: http://auth-svc:3001
    depends_on:
      - auth-svc
    restart: unless-stopped

  doc-svc:
    build: ./services/doc
    container_name: bidflow-doc
    ports:
      - "3003:3003"
    environment:
      PORT: 3003
      DATABASE_URL: ${DATABASE_URL}
      DOC_SCHEMA: doc
      AUTH_SVC_URL: http://auth-svc:3001
      UPLOAD_PATH: /app/uploads
    depends_on:
      - auth-svc
    volumes:
      - uploads-data:/app/uploads
    restart: unless-stopped

volumes:
  uploads-data: